name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract uploaded zip
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          mkdir -p extracted_project

          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip: $ZIP_FILE — extracting..."
            unzip -o "$ZIP_FILE" -d extracted_project

            # If the zip contains exactly one top-level folder, flatten it
            ENTRY_COUNT=$(find extracted_project -mindepth 1 -maxdepth 1 | wc -l)
            if [ "$ENTRY_COUNT" -eq 1 ]; then
              INNER=$(find extracted_project -mindepth 1 -maxdepth 1)
              if [ -d "$INNER" ]; then
                echo "Flattening single top-level folder: $INNER"
                shopt -s dotglob
                mv "$INNER"/* extracted_project/
                shopt -u dotglob
                rmdir "$INNER"
              fi
            fi
          else
            echo "No zip found, assuming project already unpacked at repo root."
            shopt -s dotglob
            for f in *; do
              [ "$f" = "extracted_project" ] && continue
              cp -r "$f" extracted_project/
            done
            shopt -u dotglob
          fi

          echo "Contents of extracted_project:"
          ls -la extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: extracted_project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cwrv-multiwick-debug-apk
          path: extracted_project/app/build/outputs/apk/debug/app-debug.apk
